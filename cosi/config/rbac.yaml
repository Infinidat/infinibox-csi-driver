---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: infinidat-cosi-driver
  labels:
    app.kubernetes.io/name: cosi-driver.infinidat.com
    app.kubernetes.io/instance: cosi-driver.infinidat.com
    app.kubernetes.io/part-of: cosi-driver-sample
    app.kubernetes.io/component: cosi-driver
    app.kubernetes.io/managed-by: kustomize
rules:
- apiGroups: ["objectstorage.k8s.io"]
  resources:
    - "buckets"
    - "bucketaccesses"
    - "bucketclaims"
    - "bucketaccessclasses"
    - "buckets/status"
    - "bucketaccesses/status"
    - "bucketclaims/status"
    - "bucketaccessclasses/status"
  verbs:
    - "get"
    - "list"
    - "watch"
    - "update"
    - "create"
    - "delete"
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs:
    - "get"
    - "watch"
    - "list"
    - "delete"
    - "update"
    - "create"
- apiGroups: [""]
  resources:
    - "secrets"
    - "events"
  verbs:
    - "get"
    - "list"
    - "watch"
    - "update"
    - "create"
    - "delete"
    - "patch"
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: infinidat-cosi-driver
  labels:
    app.kubernetes.io/name: cosi-driver.infinidat.com
    app.kubernetes.io/instance: cosi-driver.infinidat.com
    app.kubernetes.io/part-of: cosi-driver-sample
    app.kubernetes.io/component: cosi-driver
    app.kubernetes.io/managed-by: kustomize
subjects:
  - kind: ServiceAccount
    name: infinidat-cosi-driver
    namespace: infinidat-csi
roleRef:
  kind: ClusterRole
  name: infinidat-cosi-driver
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infinidat-cosi-driver
  namespace: infinidat-csi
  labels:
    app.kubernetes.io/name: cosi-driver.infinidat.com
    app.kubernetes.io/instance: cosi-driver.infinidat.com
    app.kubernetes.io/part-of: cosi-driver-sample
    app.kubernetes.io/component: cosi-driver
    app.kubernetes.io/managed-by: kustomize
