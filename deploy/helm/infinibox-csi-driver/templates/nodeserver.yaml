{{- if eq .Values.e2etesting "true" }}
apiVersion: v1
kind: Service
metadata:
  name: node-socat-service
  namespace: {{ .Release.NameSpace }}
spec:
  selector:
    app: {{ .Release.Name }}-node
  type: NodePort
  ports:
    - protocol: TCP
      port: 10001
      nodePort: 30008
{{- end }}
---
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}-node
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-node
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-node
    spec:
      {{- if .Values.nodeserver.tolerations }}
      tolerations:
        {{- toYaml .Values.nodeserver.tolerations | nindent 8 }}
      {{- end }}
      serviceAccount: {{ .Release.Name }}-node
      hostNetwork: true
      dnsPolicy: {{ .Values.dnsPolicy | default "Default" | quote }}
      containers:  
        {{- if eq .Values.e2etesting "true" }}
        - name: socat
          image: alpine/socat:1.0.3
          args:
            - tcp-listen:10001,fork,reuseaddr
            - unix-connect:/var/run/csi/csi.sock
          volumeMounts:
            - name: driver-path
              mountPath: /var/run/csi
        {{- end }}
        - name: liveness-probe
          image: {{ required "csi liveness sidercar image." .Values.images.livenesssidecar }}
          imagePullPolicy: {{ .Values.images.livenesssidecar_pull_policy | default "Always" | quote }}
          args:
            - "--v=5"
            - "--csi-address=$(ADDRESS)"
            - "--health-port={{  .Values.healthPortDriverNode | default 9807 }}"
          env:
            - name: ADDRESS
              value: /var/run/csi/csi.sock
          volumeMounts:
            - name: driver-path
              mountPath: /var/run/csi
        - name: driver
          ports:
            - containerPort: {{  .Values.healthPortDriverNode | default 9807 }}
              name: liveness-port
              protocol: TCP
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: liveness-port
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 2
          resources:
            limits:
              cpu: {{ .Values.nodeserver.resources.limits.cpu | default "0.5" | quote }}
              memory: {{ .Values.nodeserver.resources.limits.memory | default "450Mi" | quote }}
            requests:
              cpu: {{ .Values.nodeserver.resources.requests.cpu | default "0.1" | quote }}
              memory: {{ .Values.nodeserver.resources.requests.memory | default "150Mi" | quote }}
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true              
          image: {{ required "Provide the Infinibox csi driver container image." .Values.images.csidriver }}
          imagePullPolicy: {{ .Values.images.csidriver_pull_policy | default "Always" | quote }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CSI_DRIVER_ROLE
              value: "node"
            - name: CSI_ENDPOINT
              value: unix:///var/lib/kubelet/plugins/infinibox.infinidat.com/csi.sock
            - name: PRIMARY_IBOX_CREDENTIAL
              value: {{ .Values.primaryIboxCredential }}
            - name: APP_LOG_LEVEL
              value: {{ .Values.logLevel }}
            - name: BURST_LIMIT
              value: "{{ .Values.burstLimit }}"
            - name: QPS_LIMIT
              value: "{{ .Values.qpsLimit }}"
            - name: APP_LOG_FORMAT
              value: {{ .Values.logFormat }}
            - name: PROTOCOL_SECRET
              value: "{{ .Values.protocolSecret }}"
            - name: CREATE_EVENTS
              value: "{{ .Values.createEvents }}"
            - name: IBOX_HOST_NAMING_CONVENTION
              value: "{{ .Values.iboxHostNamingConvention }}"
            - name: CLEANUP_NFS_PERMS
              value: "{{ .Values.cleanupNFSPerms }}"
            - name: MULTIPATH_CLEANUP_DELAY
              value: "{{ .Values.multipathCleanupDelay }}"
            - name: MULTIPATH_WAIT
              value: "{{ .Values.multipathWait }}"
            - name: MULTIPATH_FLUSH_RETRIES
              value: "{{ .Values.multipathFlushRetries }}"
            - name: MULTIPATH_FLUSH_RETRY_DELAY_SECONDS
              value: "{{ .Values.multipathFlushRetryDelaySeconds }}"
            - name: FC_SEARCH_DISK_DELAY
              value: "{{ .Values.fcSearchDiskDelay }}"
            - name: RESIZE2FS_DELAY
              value: "{{ .Values.resize2fsDelay }}"
            - name: CSI_DRIVER_NAME
              value: {{ required "Provide CSI Driver Name"  .Values.csiDriverName }}
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: driver-path
              mountPath: /var/lib/kubelet/plugins/infinibox.infinidat.com
            - name: host-dir
              mountPath: /host
              mountPropagation: "Bidirectional"
        - name: registrar
          image: {{ required "Provide the csi node registrar sidecar container image." .Values.images.registrarsidecar }}
          imagePullPolicy: {{ .Values.images.registrarsidecar_pull_policy | default "Always" | quote }}
          args:
            - "--v=5"
            - "--csi-address=$(ADDRESS)"
            - "--kubelet-registration-path=/var/lib/kubelet/plugins/infinibox.infinidat.com/csi.sock"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP                  
          volumeMounts:
            - name: registration-dir
              mountPath: /registration
            - name: driver-path
              mountPath: /csi
      volumes:
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: DirectoryOrCreate
        - name: driver-path
          hostPath:
            path: /var/lib/kubelet/plugins/infinibox.infinidat.com
            type: DirectoryOrCreate
        - name: host-dir
          hostPath:
            path: /
            type: Directory
      imagePullSecrets: []
