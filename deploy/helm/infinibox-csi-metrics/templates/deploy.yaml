apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccount: {{ .Release.Name }}
      imagePullSecrets:
      - name: {{ .Values.imagePullSecret }}
      containers:
      - image: {{ .Values.images.metricsimage }}
        imagePullPolicy: {{ .Values.images.metricsimage_pull_policy }}
        name: metrics
        resources:
          limits:
            cpu: {{ .Values.metricsserver.resources.limits.cpu | default "0.5" | quote }}
            memory: {{ .Values.metricsserver.resources.limits.memory | default "450Mi" | quote }}
          requests:
            cpu: {{ .Values.metricsserver.resources.requests.cpu | default "0.1" | quote }}
            memory: {{ .Values.metricsserver.resources.requests.memory | default "150Mi" | quote }}
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: TLS_LISTEN
            value: {{ .Values.tls.enabled | quote }}
          - name: APP_LOG_LEVEL
            value: trace
        volumeMounts:
          - name: config-volume
            readOnly: true
            mountPath: /tmp/infinidat-csi-metrics-config
{{- if .Values.tls.enabled }}
          - name: tls-volume
            mountPath: /tmp # Path where the certificate will be mounted
            readOnly: true
{{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ .Release.Name }}-config
{{- if .Values.tls.enabled }}
        - name: tls-volume
          secret:
            secretName: {{ .Release.Name }}-tls-secret
{{- end }}

