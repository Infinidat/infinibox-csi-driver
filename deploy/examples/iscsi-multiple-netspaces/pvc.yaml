apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iscsi-pvc-multiple
  namespace: $_E2E_NAMESPACE
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ibox-iscsi-multiple
  #volumeName: <<pv name>> #need to uncomment if want to existing pv
