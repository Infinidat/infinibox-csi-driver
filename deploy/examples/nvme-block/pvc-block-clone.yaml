apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: nvme-block-pvc-clone
    namespace: $_E2E_NAMESPACE
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Block
  storageClassName: ibox-nvme-block
  resources:
    requests:
      storage: 1Gi
  dataSource:
    kind: PersistentVolumeClaim
    name: nvme-block-pvc
