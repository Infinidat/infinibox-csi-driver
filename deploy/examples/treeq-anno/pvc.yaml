apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: treeq-pvc-anno
  namespace: $_E2E_NAMESPACE
  annotations:
    infinidat.com/pool_name: $_E2E_POOL
    infinidat.com/network_space: $_E2E_NAS_NETWORK_SPACE
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ibox-treeq-anno
