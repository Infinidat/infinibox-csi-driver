apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iscsi-rox-block-pvc
  namespace: $_E2E_NAMESPACE
spec:
  accessModes:
    - ReadOnlyMany
  volumeMode: Block
  resources:
    requests:
      storage: 1Gi
  storageClassName: ibox-iscsi-rox-readers
  volumeName: block-rox-pv-from-existing

