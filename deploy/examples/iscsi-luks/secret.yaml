# The passphrase of the PVC iscsi-pvc-luks (see encryption_secret_name in the StorageClass).
# It must exist before the pod starts, and must be kept: without it the data cannot be read.
# The value is used byte for byte, a trailing newline is part of the passphrase.
apiVersion: v1
kind: Secret
metadata:
  name: iscsi-pvc-luks-luks
  namespace: $_E2E_NAMESPACE
type: Opaque
stringData:
  passphrase: "$_E2E_LUKS_PASSPHRASE"
