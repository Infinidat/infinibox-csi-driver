apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/provisioned-by: infinibox-csi-driver
  name: csi-1c1324de94
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 2Gi
  csi:
    controllerExpandSecretRef:
      name: infinibox-creds
      namespace: $_E2E_NAMESPACE
    controllerPublishSecretRef:
      name: infinibox-creds
      namespace: $_E2E_NAMESPACE
    driver: infinibox-csi-driver
    nodePublishSecretRef:
      name: infinibox-creds
      namespace: $_E2E_NAMESPACE
    nodeStageSecretRef:
      name: infinibox-creds
      namespace: $_E2E_NAMESPACE
    nodeExpandSecretRef:
      name: infinibox-creds
      namespace: $_E2E_NAMESPACE
    volumeAttributes:
      exportID: 3000
      ipAddress: 172.17.35.45
      storage_protocol: nfs
      network_space: NAS
      # uid: 1000
      # gid: 1000
      # unix_permissions: 777
      volPathd: /csi-1c1324de94
    volumeHandle: 7394$$nfs
  persistentVolumeReclaimPolicy: Delete
  storageClassName: $TEST_NAME
  volumeMode: Filesystem
  mountOptions:
    - vers=4.1
    - port=12049
    - hard
    - rsize=1048576
    - wsize=1048576
