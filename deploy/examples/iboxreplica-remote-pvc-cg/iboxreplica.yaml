apiVersion: csidriver.infinidat.com/v1
kind: Iboxreplica
metadata:
  annotations:
    infinidat.com/secret_name: infinibox-creds
    infinidat.com/secret_namespace: infinidat-csi
  name: iboxreplica-remote-pvc-cg
spec:
  description: "async-cg-volume-iboxreplica-test"  # user defined description
  entity_type: "CONSISTENCY_GROUP"                 # valid values are VOLUME, CONSISTENCY_GROUP, FILESYSTEM
  local_entity_name: $_E2E_IBOXREPLICA_CG # the volume name of the volume to be replicated
  remote_entity_name: $_E2E_IBOXREPLICA_CG   # the remote (target) volume name of the volume to be replicated
  replication_type: "ASYNC"                     # valid values can be SYNC, ASYNC or ACTIVE_ACTIVE
  base_action: "NEW"                            # value value is NEW
  link_remote_system_name: $_E2E_IBOXREPLICA_LINK_REMOTE_SYSTEM_NAME # the replication link name on the ibox
  remote_pool_id: $_E2E_IBOXREPLICA_REMOTE_POOL_ID # the pool ID on the remote ibox
  remote_ibox_credential_name: $_E2E_IBOXREPLICA_REMOTE_IBOX_SECRET_NAME
  remote_ibox_credential_namespace: $_E2E_IBOXREPLICA_REMOTE_IBOX_SECRET_NAMESPACE
  remote_create_pvc: true
  remote_pvc_name_suffix: "-box-ht23"
  remote_pvc_namespace: infinidat-csi
  remote_network_space: ISCSI2
  remote_pool_name: csitesting2
