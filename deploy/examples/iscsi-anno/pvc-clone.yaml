apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: iscsi-pvc-clone-anno
    namespace: $_E2E_NAMESPACE
    annotations:
      # the following annotations have to match those in pvc.yaml
      infinidat.com/network_space: $_E2E_ISCSI_NETWORK_SPACE
      infinidat.com/pool_name: $_E2E_POOL
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: $TEST_NAME
  resources:
    requests:
      storage: 1Gi
  dataSource:
    kind: PersistentVolumeClaim
    name: $TEST_NAME
