apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-dnsname-pvc
  namespace: $_E2E_NAMESPACE
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ibox-dnsname-nfs
  # volumeName: <<pv name>> #need to uncomment if want to use an existing pv
