apiVersion: v1
kind: PersistentVolume
metadata:
  name: jeff-volume
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 1Gi
  csi:
    controllerExpandSecretRef:
      name: infinibox-creds
      namespace: $_E2E_NAMESPACE
    controllerPublishSecretRef:
      name: infinibox-creds
      namespace: $_E2E_NAMESPACE
    driver: infinibox-csi-driver
    fsType: ext4
    nodePublishSecretRef:
      name: infinibox-creds
      namespace: $_E2E_NAMESPACE
    nodeStageSecretRef:
      name: infinibox-creds
      namespace: $_E2E_NAMESPACE
    nodeExpandSecretRef:
      name: infinibox-creds
      namespace: $_E2E_NAMESPACE
    volumeAttributes:
      storage.kubernetes.io/csiProvisionerIdentity: 1731709114360-6181-infinibox-csi-driver
      storage_protocol: fc
    volumeHandle: 2922271$$fc
  persistentVolumeReclaimPolicy: Delete
  storageClassName: ibox-fc
  volumeMode: Filesystem
