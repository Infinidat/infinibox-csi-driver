apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/provisioned-by: infinibox-csi-driver 
  name: user1-pv
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 1Gi
  csi:
    controllerExpandSecretRef:
      name: infinibox-creds
      namespace: $_E2E_NAMESPACE
    controllerPublishSecretRef:
      name: infinibox-creds
      namespace: $_E2E_NAMESPACE
    nodePublishSecretRef:
      name: infinibox-creds
      namespace: $_E2E_NAMESPACE
    nodeStageSecretRef:
      name: infinibox-creds
      namespace: $_E2E_NAMESPACE
    nodeExpandSecretRef:
      name: infinibox-creds
      namespace: $_E2E_NAMESPACE
    driver: infinibox-csi-driver
    volumeAttributes:
      ipAddress: 99.99.99.99
      storage_protocol: nfs_treeq
      volumePath: /treeq-filesystem-test/user1
      nfs_export_permissions : "[{'access':'RW','client':'*','no_root_squash':true}]"
    volumeHandle: 934#20002$$nfs_treeq
  persistentVolumeReclaimPolicy: Retain
  storageClassName: $TEST_NAME
  volumeMode: Filesystem
  mountOptions:
    - hard
    - rsize=1048576
    - wsize=1048576
