apiVersion: csidriver.infinidat.com/v1
kind: Iboxreplica
metadata:
  annotations:
    infinidat.com/secret_name: infinibox-creds
    infinidat.com/secret_namespace: infinidat-csi
  name: iboxreplica-remote-pvc-nfs
spec:
  description: "nfs-volume-iboxreplica-test"  # user defined description
  entity_type: "FILESYSTEM"                         # valid values are VOLUME, CONSISTENCY_GROUP, FILESYSTEM
  local_entity_name: $_E2E_IBOXREPLICA_FILESYSTEM   # the filesystem to be replicated
  remote_entity_name: $_E2E_IBOXREPLICA_FILESYSTEM   # the remote (target) filesystem to be replicated
  replication_type: "ASYNC"                     # valid values can be SYNC, ASYNC or ACTIVE_ACTIVE
  base_action: "NEW"                            # value value is NEW
  link_remote_system_name: $_E2E_IBOXREPLICA_LINK_REMOTE_SYSTEM_NAME # the replication link name on the ibox
  remote_pool_name: $_E2E_IBOXREPLICA_REMOTE_POOL_NAME # the pool NAME on the remote ibox
  remote_ibox_credential_name: $_E2E_IBOXREPLICA_REMOTE_IBOX_SECRET_NAME
  remote_ibox_credential_namespace: $_E2E_IBOXREPLICA_REMOTE_IBOX_SECRET_NAMESPACE
  remote_create_pvc: true
  remote_pvc_name_suffix: $_E2E_IBOXREPLICA_REMOTE_PVC_NAME_SUFFIX
  remote_pvc_namespace: $_E2E_IBOXREPLICA_REMOTE_PVC_NAMESPACE
  remote_network_space: $_E2E_IBOXREPLICA_REMOTE_NETWORK_SPACE
