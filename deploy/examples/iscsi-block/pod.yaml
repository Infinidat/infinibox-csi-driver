kind: Pod
apiVersion: v1
metadata:
  name: $TEST_NAME
  namespace: $_E2E_NAMESPACE
spec:
  imagePullSecrets:
  - name: $_E2E_IMAGE_PULL_SECRET
  containers:
    - name: csitest
      image: $_E2E_TEST_BLOCK_IMAGE
      command: [ "csitestimageblock" ]
      volumeMounts:
      volumeDevices:
        - name: data
          devicePath: /dev/xvda
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: $TEST_NAME
