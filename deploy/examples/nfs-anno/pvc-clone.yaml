apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: nfs-pvc-clone-anno
    namespace: $_E2E_NAMESPACE
    annotations:
      # the following annotations have to match the values in pvc.yaml
      infinidat.com/pool_name: $_E2E_POOL
      infinidat.com/network_space: $_E2E_NAS_NETWORK_SPACE
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ibox-nfs-anno
  resources:
    requests:
      storage: 1Gi
  dataSource:
    kind: PersistentVolumeClaim
    name: nfs-pvc-anno
